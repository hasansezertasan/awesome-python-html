# Based on https://github.com/best-of-lists/best-of-update-action/blob/v0.8.5/workflows/update-best-of-list.yml
name: update-best-of-list

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to use for this update"
        required: false
  schedule:
    - cron: "0 18 * * 4" # Every thursday at 6pm

env:
  BRANCH_PREFIX: "update/"
  DEFAULT_BRANCH: "main"

jobs:
  update-best-of-list:
    runs-on: ubuntu-latest
    steps:
      - name: check-github-api-token
        shell: bash
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: |
          if [ -z "$GH_API_TOKEN" ]; then
            echo "::error::Set the GH_API_TOKEN repository secret to a classic personal access token with no scopes for public repository metadata."
            exit 1
          fi
          # Check an active external repository and the fields used by best-of-generator.
          query='{ repository(owner: "PrefectHQ", name: "fastmcp") {
            name nameWithOwner description url homepageUrl createdAt updatedAt pushedAt diskUsage
            primaryLanguage { name } licenseInfo { spdxId }
            stargazers { totalCount } watchers { totalCount } forks { totalCount }
            pullRequests { totalCount } issues(states: OPEN) { totalCount }
            closedIssues: issues(states: CLOSED) { totalCount }
            repositoryTopics(first: 1) { nodes { topic { name } } }
            defaultBranchRef { target { ... on Commit { committedDate history(first: 1) { totalCount } } } }
            releases(first: 1, orderBy: {field: CREATED_AT, direction: DESC}) {
              nodes { createdAt publishedAt tagName isDraft isPrerelease
                releaseAssets(first: 1) { nodes { downloadCount } } } } } }'
          if ! response=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 60 \
            https://api.github.com/graphql \
            -H "Authorization: bearer $GH_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg query "$query" '{query: $query}')"); then
            echo "::error::GitHub GraphQL request failed. Check GH_API_TOKEN and API availability."
            exit 1
          fi
          if ! jq -e '((.errors // []) | length == 0) and (.data.repository | .url == "https://github.com/PrefectHQ/fastmcp" and (.stargazers.totalCount | type == "number"))' <<< "$response" > /dev/null; then
            echo "::error::GH_API_TOKEN cannot read the GitHub metadata required by best-of-generator. Use a classic personal access token with no scopes."
            exit 1
          fi
      - if: ${{ github.event.inputs != null  &&  github.event.inputs.version != null }}
        name: set-version-from-input
        run: echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
      - if: ${{ ! (env.VERSION != null && env.VERSION != '') }}
        name: set-version-via-date
        run: echo "VERSION=$(date '+%Y.%m.%d')" >> $GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: check-version-tag
        shell: bash
        run: |
          git fetch --tags --force
          git show-ref --tags --verify --quiet -- "refs/tags/${{ env.VERSION }}" && echo "VERSION=$(date '+%Y.%m.%d-%H.%M')" >> $GITHUB_ENV || exit 0
      - name: create-update-branch
        uses: peterjgrainger/action-create-branch@4b81ce657e255acd677cc6c55c9c763654be3aef # v4.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: "${{ env.BRANCH_PREFIX }}${{ env.VERSION }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH_PREFIX }}${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: update-best-of-list
        uses: best-of-lists/best-of-update-action@ee4e7b88df0e3538d496eab82fe5b4e613c999ef # v0.8.5
        with:
          libraries_key: ${{ secrets.LIBRARIES_KEY }}
          # Public metadata needs a classic PAT; see best-of-lists/best-of-generator#90.
          github_key: ${{ secrets.GH_API_TOKEN }}
      - name: push-update
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          branch: ${{ env.BRANCH_PREFIX }}${{ env.VERSION  }}
          commit_user_name: best-of update
          commit_user_email: actions@github.com
          commit_message: Update best-of list for version ${{ env.VERSION  }}
          tagging_message: ${{ env.VERSION  }}
          skip_dirty_check: true
          commit_options: "--allow-empty"
      - name: create-pull-request
        shell: bash
        run: |
          # Stops script execution if a command has an error
          set -e
          curl -fsSL https://github.com/github/hub/raw/master/script/get | bash -s 2.14.2
          bin/hub pull-request -b ${{ env.DEFAULT_BRANCH }} -h ${{ env.BRANCH_PREFIX }}${{ env.VERSION  }} --no-edit -m "Best-of update: ${{ env.VERSION  }}" -m "To finish this update: Select <code>Merge pull request</code> below and <code>Confirm merge</code>. Also, make sure to publish the created draft release in the [releases section](../releases) as well." || true
          rm bin/hub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: create-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION  }}
          name: "Update: ${{ env.VERSION  }}"
          body_path: "latest-changes.md"
          draft: true
          prerelease: false
